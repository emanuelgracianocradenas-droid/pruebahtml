<!DOCTYPE html>
<html lang="es">

<head>
    <meta http-equiv="refresh" content="0; url=registro.php">
    <script>window.location.replace('registro.php');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
</head>
<body>
    <div class="container">
        <h1>Registro</h1>
        <form id="registroForm">    
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" required>
                </div>
            </div>
            <label for="genero">Género</label>
            

            <select id="genero" class="form-control" required>
                <option value="">Seleccione...</option>
                <option value="masculino">Masculino</option>
                <option value="femenino">Femenino</option>
            </select>
            <div class="form-row">
                <div class="form-group">
                    <label for="tipoDocumento">Tipo de Documento</label>
                    <select id="tipoDocumento" name="tipoDocumento" required>
                        <option value="">Seleccionar...</option>
                        <option value="CC">Cédula de Ciudadanía</option>
                        <option value="TI">Tarjeta de Identidad</option>
                        <option value="CE">Cédula de Extranjería</option>
                        <option value="PA">Pasaporte</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="numeroDocumento">Número de Documento</label>
                    <input type="number" id="numeroDocumento" name="numeroDocumento" required>
                </div>
            </div>

            <div class="form-group">
                <label for="direccion">Dirección</label>
                <input type="text" id="direccion" name="direccion" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" required>
                </div>
                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="contraseña">Contraseña</label>
                    <input type="password" id="contraseña" name="contraseña" required>
                </div>
                <div class="form-group">
                    <label for="confirmarContraseña">Confirmar Contraseña</label>
                    <input type="password" id="confirmarContraseña" name="confirmarContraseña" required>
                </div>
            </div>

            <button type="submit">Registrarse</button>
        </form>
    </div>
    <script>
        document.getElementById('registroForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const datos = {
                nombre: document.getElementById('nombre').value,
                apellido: document.getElementById('apellido').value,
                genero: document.getElementById('genero').value,
                tipo_documento: document.getElementById('tipoDocumento').value,
                numero_documento: document.getElementById('numeroDocumento').value,
                direccion: document.getElementById('direccion').value,
                telefono: document.getElementById('telefono').value,
                correo: document.getElementById('correo').value,
                contrasena: document.getElementById('contraseña').value
            };

            try {
                const respuesta = await fetch('http://localhost:3000/api/registro', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(datos)
                });

                const resultado = await respuesta.json();

                if (resultado.success) {
                    alert('¡Cliente registrado exitosamente!');
                    window.location.href = 'login.html';
                }

            } catch (error) {
                console.error('Error:', error);
                alert('No se pudo conectar con el servidor.');
            }
        });
    </script>
</body>

</html>
