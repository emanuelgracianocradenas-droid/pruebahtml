<!doctype html>
<html lang="es">
<head>
  <meta http-equiv="refresh" content="0; url=login.php">
  <script>window.location.replace('login.php');</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../css/login.css">
  <title>Iniciar sesión</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background:#f2f2f2; }
    .container { max-width:420px; margin:80px auto; background:#fff; padding:24px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1);} 
    label{display:block; margin-bottom:6px}
    input[type="email"], input[type="password"] { width:100%; padding:10px; margin:6px 0 12px; box-sizing:border-box; border:1px solid #ccc; border-radius:4px }
    button { width:100%; padding:10px; background:#007bff; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:1rem }
    .error{color:#c00; margin-bottom:12px}
    .note{font-size:0.9rem; color:#555}
    a.small{font-size:0.9rem}
  </style>
</head>
<body>
  <div class="container">
    <h2>Iniciar sesión</h2>

    <div id="errorMsg" class="error"></div>

    <!-- El action apunta a backend/login.php según los requerimientos de login.php -->
    <form method="post" action="../../backend/login.php" id="loginForm" autocomplete="on">

      <label for="name">Nombre de usuario</label>
      <input type="text" id="name" name="name" required autofocus autocomplete="username" placeholder="Nombre de usuario">

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" required autofocus autocomplete="email" placeholder="usuario@ejemplo.com">

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required minlength="6" autocomplete="current-password" placeholder="Contraseña">

      <button type="submit">Entrar</button>
    </form>

    <p class="note">¿No tienes cuenta? <a class="small" href="registro.html">Regístrate</a></p>
  </div>

  <script>
    // Muestra mensajes de error que envía login.php mediante query string ?error=1 ó ?error=2
    (function(){
      const params = new URLSearchParams(location.search);
      const e = params.get('error');
      const el = document.getElementById('errorMsg');
      if (!e) return;
      if (e === '1') el.textContent = 'Email o contraseña incorrectos.';
      else if (e === '2') el.textContent = 'Por favor completa ambos campos.';
      else el.textContent = 'Error de inicio de sesión.';
    })();

    // Evitar reenviar formulario con GET/refresh mostrando mensajes
    if (window.history && window.history.replaceState) {
      window.history.replaceState({}, document.title, window.location.pathname);
    }
    
  </script>
</body>
</html>
